[package]
name = "bluemon-tui"
version = "0.1.0"
edition = "2021"
description = "Interactive BLE scanner with htop-like TUI"

[dependencies]
btleplug = "0.11"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
mac_oui = { version = "0.4", features = ["with-db"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
uuid = "1"
toml = "0.8"
rumqttc = "0.24"
